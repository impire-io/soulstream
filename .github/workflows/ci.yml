name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The remote node lives in its own module (node/). It was dormant while
  # soulidentity was private; the whole impire-io stack is public since
  # 2026-08-03, so no credential exists here. GOPRIVATE keeps the fetches
  # direct (freshly pushed tags, no module-proxy lag); the soulstream dep
  # is a relative `replace => ../`.
  node:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/impire-io/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod

      - name: gofmt
        working-directory: node
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

      - name: Build
        working-directory: node
        run: go build ./...

      - name: Test
        working-directory: node
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: node
