# Release config for the remote node (github.com/impire-io/soulstream/node),
# a SEPARATE Go module under node/ that imports the private soulidentity
# module. It ships as its own set of archives APPENDED to the same tag's
# GitHub release the core `.goreleaser.yaml` creates — kept separate so a
# core release never depends on the private credential the node build needs.
#
# Local snapshot check:  goreleaser release --snapshot --clean -f .goreleaser.node.yaml
version: 2

project_name: soulstream-node

builds:
  - id: soulstream-node
    dir: node # build the node module, not the root
    main: ./cmd/soulstream-node
    binary: soulstream-node
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # The node binary stamps package-main's `version`, not the core's
    # internal/version — it is a different module.
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: soulstream-node
    ids: [soulstream-node]
    name_template: "soulstream-node_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - docs/mcp-remote.md
      - specs/018-remote-mcp-node/quickstart.md
      - specs/018-remote-mcp-node/contracts/authorization-server.md

# A distinct checksum file so it never clobbers the core run's checksums.txt.
checksum:
  name_template: checksums-node.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true # the core release owns the changelog for the tag

release:
  github:
    owner: impire-io
    name: soulstream
  # Add these archives to the release the core run already made for this tag,
  # instead of recreating it.
  mode: append
  draft: false
  prerelease: auto
