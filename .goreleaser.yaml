version: 2

project_name: soulstream

builds:
  - id: soulstream
    main: ./cmd/soulstream
    binary: soulstream
    env:
      - CGO_ENABLED=0
    # No windows: the founding ceremony refuses filesystems that cannot
    # hold 0700/0600 modes (owner-only custody is load-bearing), so a
    # windows binary would refuse at init — honest scope, not an
    # oversight. Revisit with a measured windows custody story.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/impire-io/soulstream/internal/version.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One archive per platform.
archives:
  - id: soulstream
    ids: [soulstream]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

release:
  github:
    owner: impire-io
    name: soulstream
  draft: false
  prerelease: auto

# The Homebrew tap: `brew install impire-io/tap/soulstream`. The formula
# is pushed to impire-io/homebrew-tap on every release — RCs included,
# deliberately: pre-v1 the candidates ARE the releases, and the tap is
# the one-command install path (no Go toolchain, nothing edited).
# Needs the HOMEBREW_TAP_TOKEN repo secret (fine-grained PAT, contents
# read/write on the tap repo) — the workflow passes it through.
brews:
  - name: soulstream
    ids: [soulstream]
    repository:
      owner: impire-io
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/impire-io/soulstream
    description: "Your realm in one binary — the Soulstream node"
    skip_upload: false
    commit_msg_template: "brew: soulstream {{ .Tag }}"
    commit_author:
      name: soulstream-release
      email: noreply@impire.io
    install: |
      bin.install "soulstream"
    test: |
      assert_match version.to_s, shell_output("#{bin}/soulstream version")
